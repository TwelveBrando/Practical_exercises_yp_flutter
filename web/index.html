<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Агентство Alibi: заявки, услуги и личный кабинет.">
  <meta name="theme-color" content="#7A4E56">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alibi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Агентство Alibi</title>
  <style>
    html, body { margin: 0; background: #faf8f6; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 16px Arial, sans-serif; color: #382c2d; }
    #loading h1 { font-size: 28px; font-weight: 500; }
    .spinner { width: 36px; height: 36px; border: 3px solid #e9e1de; border-top-color: #7a4e56; border-radius: 50%; animation: spin 1s linear infinite; }
    #startup-error { max-width: 320px; padding: 16px; text-align: center; }
    #startup-error button { padding: 10px 24px; border: 0; border-radius: 24px; background: #7a4e56; color: white; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <h1>Агентство Alibi</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p>Загрузка приложения…</p>
    <div id="startup-error" hidden>
      <p>Не удалось загрузить приложение. Проверьте соединение.</p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
